<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metadata Sökmotor</title>
</head>
<body>

    <h1>Metadata Sökmotor</h1>
    <p>Sök efter bilder och filtrera deras metadata.</p>

    <form id="searchForm">
        <label for="searchInput">Sök efter filnamn:</label>
        <input
            type="text"
            id="searchInput"
            placeholder="Skriv ett filnamn..."
        >

        <label for="artistFilter">Artist:</label>
        <select id="artistFilter">
            <option value="">Alla</option>
            <option value="AI generated">AI generated</option>
        </select>

        <label for="minWidth">Minsta bredd (pixlar):</label>
        <input
            type="number"
            id="minWidth"
            min="0"
            step="1"
            placeholder="T.ex. 10000"
        >

        <button type="submit">Sök</button>
    </form>

    <h2>Sökresultat</h2>
    <p id="message"></p>
    <div id="results"></div>

    <script>
        const form = document.getElementById("searchForm");
        const input = document.getElementById("searchInput");
        const artistFilter = document.getElementById("artistFilter");
        const minWidth = document.getElementById("minWidth");
        const results = document.getElementById("results");
        const message = document.getElementById("message");

        form.addEventListener("submit", async function(event) {
            event.preventDefault();

            const query = input.value.trim();
            const artist = artistFilter.value;
            const width = minWidth.value;

            results.innerHTML = "";
            message.textContent = "Söker...";

            try {
                const params = new URLSearchParams({
                    q: query,
                    artist: artist,
                    minWidth: width
                });

                const response = await fetch(
                    "/api/search?" + params.toString()
                );

                if (!response.ok) {
                    throw new Error("Serverfel");
                }

                const data = await response.json();

                message.textContent =
                    data.total + " filer hittades.";

                data.results.forEach(function(file) {
                    const item = document.createElement("div");
                    const title = document.createElement("h3");
                    const metadata = document.createElement("pre");

                    title.textContent = file.fileName;
                    metadata.textContent =
                        JSON.stringify(file.metadata, null, 2);

                    item.appendChild(title);
                    item.appendChild(metadata);
                    results.appendChild(item);
                });

            } catch (error) {
                message.textContent =
                    "Ett fel uppstod vid sökningen.";
            }
        });
    </script>

</body>
</html>
